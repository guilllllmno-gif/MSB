<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>变更治理 · FuturePayCA 风控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="risk-design-system.css">
<style>
  .tbl tbody tr.clickable{cursor:pointer}
  .cc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cc .b{border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .cc .bl{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .cc .mrow{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
  .cc .mrow b{font-variant-numeric:tabular-nums}
</style>
</head>
<body data-page="governance" data-crumb="风控·检测策略·变更治理">
<div class="app">
  <aside class="sidebar" id="rcSidebar"></aside>
  <div class="main">
    <header class="topbar" id="rcTopbar"></header>
    <div class="content"><div class="content-wrap">

      <div class="pg-head">
        <div>
          <h1 class="pg-title">变更治理</h1>
          <p class="pg-sub">所有规则变更经 diff 审查、回测验证、MLRO 审批、冠军-挑战者灰度后上线，全程留痕，监管可追溯。</p>
        </div>
        <button class="btn btn-primary" id="startChangeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>发起变更</button>
      </div>

      <div class="grid-4 mb-md">
        <div class="kpi"><div class="kpi-lbl"><span class="kpi-ico" style="background:var(--amber-bg);color:var(--amber)">📋</span>待审批</div><div class="kpi-num tnum" id="kSub">0</div><div class="small muted mt-sm">等待 MLRO 复核</div></div>
        <div class="kpi"><div class="kpi-lbl"><span class="kpi-ico" style="background:var(--blue-bg);color:var(--blue)">🧪</span>灰度中</div><div class="kpi-num tnum" id="kSha">0</div><div class="small muted mt-sm">冠军-挑战者并行</div></div>
        <div class="kpi"><div class="kpi-lbl"><span class="kpi-ico" style="background:var(--green-bg);color:var(--green)">✓</span>已上线</div><div class="kpi-num tnum" id="kLive">0</div><div class="small muted mt-sm">本期生效</div></div>
        <div class="kpi"><div class="kpi-lbl"><span class="kpi-ico" style="background:var(--red-bg);color:var(--red)">↩</span>已驳回</div><div class="kpi-num tnum" id="kRej">0</div><div class="small muted mt-sm">未通过验证</div></div>
      </div>

      <div class="table-card">
        <div class="card-head"><div><div class="card-title">变更请求</div><div class="card-desc">点击任一行查看 diff、回测对比、灰度与审批 · 当前角色：<b id="curRole">—</b></div></div>
          <div class="seg" data-scope="tr[data-row]" style="display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px">
            <button class="active" data-filter="all" style="border:none;background:none;padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit">全部</button>
            <button data-filter="open" style="border:none;background:none;padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;font-family:inherit">进行中</button>
            <button data-filter="closed" style="border:none;background:none;padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;font-family:inherit">已结</button>
          </div>
        </div>
        <table class="tbl">
          <thead><tr><th>变更号</th><th>规则</th><th>变更摘要</th><th>误报率 现行→新版</th><th>提交人</th><th>状态</th><th>提交时间</th><th style="text-align:right">操作</th></tr></thead>
          <tbody id="crBody"></tbody>
        </table>
      </div>

    </div></div>
  </div>
</div>
<script src="rc-rules-data.js"></script>
<script src="rc-rules-overlay.js"></script>
<script src="rc-changes-data.js"></script>
<script src="rc-shell.js"></script>
<script>
  const $=id=>document.getElementById(id);
  // 发起变更 —— 先选要变更的规则，再进编辑器
  $('startChangeBtn').addEventListener('click',()=>RCModal.form({
    title:'发起规则变更', desc:'选择要变更的规则，进入编辑器修改并提交评审',
    submitLabel:'打开规则编辑器',
    fields:[{name:'rule',label:'选择规则',type:'select',options:RC_RULES.map(r=>({value:r.id,label:`${r.name}（${r.id}） · 误报 ${r.fp}`}))}],
    onSubmit:v=>{ location.href='rc-rule-editor.html?id='+encodeURIComponent(v.rule); return false; }
  }));
  const S=RC_CHANGES.STATES;
  const ROLE=()=>window.RC_ROLE?RC_ROLE.get():'rc';
  const ACTOR=()=>window.RC_ROLE?RC_ROLE.cur().actor.n:'James Liu';

  function render(){
    const all=RC_CHANGES.all();
    const by=s=>all.filter(c=>c.state===s).length;
    $('kSub').textContent=by('submitted'); $('kSha').textContent=by('shadow'); $('kLive').textContent=by('live'); $('kRej').textContent=by('rejected');
    $('curRole').textContent=(window.RC_ROLE?RC_ROLE.cur().label:'风控');
    const openStates=['submitted','shadow'];
    const role=ROLE();
    $('crBody').innerHTML=all.map(c=>{
      const st=S[c.state];
      const cf=parseInt((c.champion||{}).fp)||0, nf=parseInt((c.challenger||{}).fp)||0;
      const fp=(c.champion&&c.challenger)?`${c.champion.fp} → <b style="color:${nf<=cf?'var(--green)':'var(--red)'}">${c.challenger.fp}</b>`:'—';
      const row=openStates.includes(c.state)?'open':'closed';
      const canAct=RC_CHANGES.nextActions(c).some(a=>a.role==='any'||a.role===role);  // 当前角色是否有可执行动作
      return `<tr class="clickable" data-row="${row}" onclick="openCR('${c.no}')">
        <td class="mono cell-strong">${c.no}</td><td>${c.rule}</td><td class="muted">${c.summary}</td>
        <td class="tnum">${fp}</td><td>${c.by}</td><td><span class="pill ${st.cls}"><span class="pdot"></span>${st.label}</span></td>
        <td class="muted tnum">${c.created}</td><td style="text-align:right"><button class="btn btn-sm" onclick="event.stopPropagation();openCR('${c.no}')">${canAct?'评审':'查看'}</button></td></tr>`;
    }).join('');
  }

  window.openCR=function(no){
    const c=RC_CHANGES.get(no); if(!c) return;
    const role=ROLE();
    const diff=`<table class="tbl" style="margin:0"><thead><tr><th>变更项</th><th>变更前</th><th>变更后</th></tr></thead><tbody>${
      (c.diff||[]).map(d=>`<tr><td class="cell-strong">${d[0]}</td><td class="muted">${d[1]}</td><td class="cell-strong" style="color:var(--brand)">${d[2]}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">无字段变更</td></tr>'
    }</tbody></table>`;
    let cc='';
    if(c.champion&&c.challenger){
      const m=(a,b,better)=>{const cls=better?'color:var(--green)':'';return `<div class="mrow"><span>${a}</span><b style="${cls}">${b}</b></div>`;};
      cc=`<div class="cc" style="margin-top:6px">
        <div class="b"><div class="bl"><span class="pdot" style="background:var(--text-3)"></span>现行 · 冠军</div>${m('命中',c.champion.hits)}${m('误报率',c.champion.fp)}${m('精确率',c.champion.precision)}</div>
        <div class="b" style="border-color:var(--blue-bd);background:var(--brand-softer)"><div class="bl" style="color:var(--brand)"><span class="pdot" style="background:var(--brand)"></span>新版 · 挑战者</div>${m('命中',c.challenger.hits)}${m('误报率',c.challenger.fp,true)}${m('精确率',c.challenger.precision,true)}</div>
      </div>`;
    }
    let shadow='';
    if(c.shadow){const s=c.shadow; const d=v=>v==null?'—':v;
      shadow=`<div style="border:1px solid var(--blue-bd);background:var(--brand-softer);border-radius:11px;padding:13px 15px;margin-top:14px">
        <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><span class="cell-strong">冠军-挑战者灰度 · 已运行 ${d(s.days)} 天</span><span class="pill p-blue">${d(s.traffic)}</span></div>
        <table class="tbl" style="margin-top:10px;background:var(--surface)"><thead><tr><th>指标</th><th>现行 · 冠军</th><th>挑战者</th></tr></thead><tbody>
          <tr><td>命中量</td><td>${d(s.champHits)}</td><td>${d(s.chalHits)}</td></tr>
          <tr><td>误报率</td><td>${d(s.champFp)}</td><td class="cell-strong" style="color:var(--green)">${d(s.chalFp)}</td></tr>
          <tr><td>真风险拦截 (TP)</td><td>${d(s.champTp)}</td><td>${d(s.chalTp)}</td></tr>
          <tr><td>精确率</td><td>${d(s.champPrec)}</td><td class="cell-strong" style="color:var(--green)">${d(s.chalPrec)}</td></tr>
          <tr><td>新增漏报</td><td>—</td><td class="cell-strong" style="color:${s.missedRisk?'var(--red)':'var(--green)'}">${d(s.missedRisk)} 笔</td></tr>
          <tr><td>SLA 影响</td><td>—</td><td>${d(s.slaDelta)}</td></tr>
        </tbody></table>
        ${s.verdict?`<div class="small" style="margin-top:8px;color:var(--text-2)"><span class="pill ${s.verdict==='达标'?'p-green':'p-amber'}" style="margin-right:6px">灰度结论 · ${s.verdict}</span>${s.verdictNote||''}</div>`:''}</div>`;
    }
    const reason=`<div style="margin-top:14px"><div class="small muted" style="font-weight:600;margin-bottom:5px">变更理由（监管可解释）</div><div style="background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.6">${c.reason||'—'}</div></div>`;
    const timeline=`<div style="margin-top:16px"><div class="small muted" style="font-weight:600;margin-bottom:8px">审计时间线</div><div class="timeline">${(c.events||[]).map(e=>`<div class="tl-item done"><div class="tl-time">${e.t}</div><div class="tl-title">${e.text} <span class="muted">· ${e.by}</span></div></div>`).join('')}</div></div>`;

    // 动作（按角色门控）
    const nexts=RC_CHANGES.nextActions(c);
    const allowed=nexts.filter(a=>a.role==='any'||a.role===role);
    const acts=allowed.map(a=>({label:a.label, kind:a.kind==='primary'?'primary':'ghost', onClick:()=>{
      RC_CHANGES.transition(c.no,a.to,{role,by:ACTOR(),team:role});
      // 上线 → 回写规则配置（版本+1、changelog、阈值/权重/动作生效）；回滚 → 还原上一版本
      if(a.to==='live' && window.RC_RULES_OVERLAY && c.patch) RC_RULES_OVERLAY.applyChange(c.ruleId, c.patch, {by:ACTOR(), no:c.no, summary:'变更上线 · '+c.summary});
      if(a.to==='rolled_back' && window.RC_RULES_OVERLAY) RC_RULES_OVERLAY.rollback(c.ruleId);
      RCModal.toast(`${c.no} · ${a.label}`); render(); return true;
    }}));
    let gate='';
    if(nexts.length && !allowed.length) gate=`<div class="note" style="margin-top:14px;background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:10px;padding:10px 13px;font-size:12.5px;color:var(--amber)">该变更需 <b>MLRO（合规）</b> 审批。请在右上角切换角色为「合规 · MLRO」后操作。</div>`;

    const html=`<div class="row" style="gap:8px;margin-bottom:12px"><span class="chip">${c.ruleId||'—'}</span><span class="pill ${S[c.state].cls}">${S[c.state].label}</span></div>
      <div class="small muted" style="font-weight:600;margin-bottom:5px">变更内容 diff</div>${diff}
      <div class="small muted" style="font-weight:600;margin:16px 0 5px">回测对比 · 冠军 vs 挑战者</div>${cc||'<span class="muted small">无回测数据</span>'}
      ${shadow}${reason}${gate}${timeline}`;
    RCModal.dialog({ title:`${c.no} · ${c.rule}`, desc:c.summary, html, actions:acts });
  };

  render();
</script>
</body>
</html>
