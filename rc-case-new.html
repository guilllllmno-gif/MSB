<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建案件 · FuturePayCA 风控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="risk-design-system.css">
<style>
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;font-weight:500;margin-bottom:14px;cursor:pointer;text-decoration:none}
  .back:hover{color:var(--text)} .back svg{width:15px;height:15px}
  .form-card{max-width:680px}
  .fld{margin-bottom:16px}
  .fld>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
  .fld .req{color:var(--red)}
  .fin,.fsel,.ftxt{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-family:inherit;font-size:13px;color:var(--text);background:var(--surface)}
  .fin:focus,.fsel:focus,.ftxt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .ftxt{min-height:70px;resize:vertical}
  .fld.err .fin,.fld.err .fsel{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .sw-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .dupe{display:none;align-items:center;gap:10px;background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:16px}
  .dupe.show{display:flex} .dupe svg{width:17px;height:17px;color:var(--amber);flex-shrink:0}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-pop);opacity:0;transition:all .25s;pointer-events:none;z-index:50}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-page="cases" data-crumb="风控·治理与合规·案件管理·新建案件">
<div class="app">
  <aside class="sidebar" id="rcSidebar"></aside>
  <div class="main">
    <header class="topbar" id="rcTopbar"></header>
    <div class="content"><div class="content-wrap">
      <a class="back" href="rc-cases.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回案件管理</a>

      <div class="pg-head"><div><h1 class="pg-title">新建案件</h1><p class="pg-sub">手动建立一个合规调查案件。案件以主体（商户）为单位聚合关联告警与订单。</p></div></div>

      <div class="card form-card">
        <div class="card-body">
          <div class="dupe" id="dupe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
            <span id="dupeTxt"></span></div>

          <div class="fld"><label>主体 / 商户 <span class="req">*</span></label>
            <input class="fin" id="merchant" list="merchants" placeholder="输入或选择商户名称…" autocomplete="off">
            <datalist id="merchants"></datalist></div>

          <div class="grid2">
            <div class="fld"><label>风险类型 <span class="req">*</span></label>
              <select class="fsel" id="type"><option value="">选择…</option><option>可疑洗钱</option><option>制裁规避</option><option>欺诈交易</option><option>结构化拆分</option><option>混币器关联</option><option>大额异常</option><option>其他</option></select></div>
            <div class="fld"><label>涉及金额</label><input class="fin" id="amount" placeholder="如 CAD 8,200.00"></div>
          </div>

          <div class="fld"><label>负责人 <span class="req">*</span></label>
            <select class="fsel" id="owner"></select></div>

          <div class="fld"><label>关联告警 / 订单编号 <span class="muted" style="font-weight:400">· 选填，逗号分隔</span></label>
            <input class="fin" id="links" placeholder="如 ALT-50231, DEP-20260315-001"></div>

          <div class="fld"><label>备注</label><textarea class="ftxt" id="note" placeholder="案件背景、调查方向…（记入审计日志）"></textarea></div>

          <div class="row" style="gap:10px;margin-top:4px">
            <a class="btn" href="rc-cases.html" style="flex:1;justify-content:center">取消</a>
            <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="createCase()">创建案件</button>
          </div>
        </div>
      </div>

    </div></div>
  </div>
</div>
<div id="toast"></div>
<script src="rc-shell.js"></script>
<script>
  const OWNERS=[{i:'JL',n:'James Liu',c:'var(--brand)'},{i:'SC',n:'Sarah Chen',c:'var(--brand)'},{i:'ML',n:'Mike Lin',c:'var(--green)'},{i:'DW',n:'David Wu (MLRO)',c:'var(--violet)'},{i:'EZ',n:'Emma Zhang (L2)',c:'var(--amber)'}];
  document.getElementById('owner').innerHTML=OWNERS.map((o,i)=>`<option value="${i}">${o.n}</option>`).join('');
  // merchant suggestions from existing cases
  const merchants=[...new Set(RC_CASES.all().map(c=>c.merchant))];
  document.getElementById('merchants').innerHTML=merchants.map(m=>`<option value="${m}">`).join('');

  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1700);}

  // warn when an OPEN case already exists for the merchant (aggregation guidance)
  const mEl=document.getElementById('merchant');
  mEl.addEventListener('input',()=>{
    const open=RC_CASES.openForMerchant(mEl.value.trim()), d=document.getElementById('dupe');
    if(open){ d.classList.add('show'); const st=(window.CASE_STATES&&CASE_STATES[open.state])?CASE_STATES[open.state].label:''; document.getElementById('dupeTxt').innerHTML=`该商户已有在办案件 <b>${open.no}</b>（${st}）。建议并入而非新建 — <a class="btn-link" href="rc-case.html?no=${open.no}">打开 ${open.no} →</a>`; }
    else d.classList.remove('show');
  });

  window.createCase=function(){
    const merchant=mEl.value.trim(), type=document.getElementById('type').value, amount=document.getElementById('amount').value.trim();
    document.querySelectorAll('.fld.err').forEach(f=>f.classList.remove('err'));
    if(!merchant){ mEl.closest('.fld').classList.add('err'); mEl.focus(); toast('请填写主体 / 商户'); return; }
    if(!type){ const f=document.getElementById('type'); f.closest('.fld').classList.add('err'); f.focus(); toast('请选择风险类型'); return; }
    const owner=OWNERS[+document.getElementById('owner').value];
    const links=document.getElementById('links').value.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean);
    const alerts=links.filter(x=>/^ALT/i.test(x)), orders=links.filter(x=>!/^ALT/i.test(x));
    const c=RC_CASES.create({merchant, type, amount:amount||'—', owner, alerts, orders, team:RC_ROLE.team()});
    toast('已创建 · '+c.no);
    setTimeout(()=>location.href='rc-case.html?no='+c.no,650);
  };
</script>
</body>
</html>
