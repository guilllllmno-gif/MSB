<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计日志 · FuturePayCA 风控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="risk-design-system.css">
</head>
<body data-page="audit" data-crumb="风控·治理与合规·审计日志">
<div class="app">
  <aside class="sidebar" id="rcSidebar"></aside>
  <div class="main">
    <header class="topbar" id="rcTopbar"></header>
    <div class="content"><div class="content-wrap">

      <div class="pg-head">
        <div>
          <h1 class="pg-title">审计日志</h1>
          <p class="pg-sub">全系统操作的不可篡改记录：风控决策、规则与策略变更、名单维护、报告报送与登录。满足 FINTRAC 留痕要求。</p>
        </div>
        <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>导出审计报告</button>
      </div>

      <div class="grid-4 mb-md">
        <div class="kpi"><div class="kpi-lbl"><span class="kpi-ico" style="background:var(--blue-bg);color:var(--blue)">📋</span>今日事件</div><div class="kpi-num tnum">1,842</div></div>
        <div class="kpi"><div class="kpi-lbl"><span class="kpi-ico" style="background:var(--amber-bg);color:var(--amber)">⚙</span>策略/规则变更</div><div class="kpi-num tnum">6</div></div>
        <div class="kpi"><div class="kpi-lbl"><span class="kpi-ico" style="background:var(--red-bg);color:var(--red)">🧊</span>冻结/驳回决策</div><div class="kpi-num tnum">23</div></div>
        <div class="kpi"><div class="kpi-lbl"><span class="kpi-ico" style="background:var(--green-bg);color:var(--green)">🔐</span>留痕完整性</div><div class="kpi-num tnum">100%</div><div class="small muted mt-sm">哈希链校验通过</div></div>
      </div>

      <div class="toolbar">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="搜索操作人、对象ID或动作…"></div>
        <div class="seg" data-scope="tr[data-row]"><button class="active" data-filter="all">全部</button><button data-filter="decision">决策</button><button data-filter="config">配置变更</button><button data-filter="report">报送</button></div>
        <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>时间范围</button>
      </div>

      <div class="table-card">
        <table class="tbl">
          <thead><tr><th>时间</th><th>操作人</th><th>角色</th><th>动作</th><th>对象</th><th>详情</th></tr></thead>
          <tbody id="ab"></tbody>
        </table>
        <div class="pager"><div class="row"><span>共 1,842 条 · 仅展示最新</span></div><div class="pager-nav"><button class="pg-btn active">1</button><button class="pg-btn">2</button><button class="pg-btn">…</button><button class="pg-btn">185</button></div></div>
      </div>

    </div></div>
  </div>
</div>
<script src="rc-changes-data.js"></script>
<script src="rc-shell.js"></script>
<script>
  const ROLE={L1:'var(--brand)',L2:'var(--blue)',MLRO:'var(--violet)',RC:'var(--brand)',SYS:'var(--grey)'};
  // 静态种子日志（决策 / 报送 / 部分配置）
  const logs=[
    ['09:30:16','系统','SYS','规则命中暂缓','DEP-20260315-001','混币器关联+大额充值 → 暂缓入账','decision'],
    ['10:12:40','Sarah Chen','L1','认领工单','DEP-20260315-001','—','decision'],
    ['11:05:02','Sarah Chen','L1','驳回并冻结','DEP-20260315-001','理由：链上溯源命中混币器','decision'],
    ['11:06:00','系统','SYS','自动升级建案','CASE-2026-0312','→ MLRO','decision'],
    ['14:20:18','David Wu','MLRO','标记敏感案件','CASE-2026-0312','避免书面留痕','decision'],
    ['17:01:48','Sarah Chen','L1','添加关注名单','群组 #A7','模型识别高频拆分','config'],
    ['16:22:05','David Wu','MLRO','提交 STR','STR-2026-028','FINTRAC 回执 FT-2026-9810','report'],
  ];
  const staticRows=logs.map(l=>({ts:'2026-06-04 '+l[0].slice(0,5),time:'2026-06-04 '+l[0],by:l[1],role:l[2],action:l[3],object:l[4],detail:l[5],cat:l[6]}));

  // 变更治理事件 → 审计记录（提交 / 批准 / 驳回 / 上线 / 回滚 全部计入）
  const actOf=t=>/提交/.test(t)?'提交规则变更':/批准/.test(t)?'批准规则变更':/驳回/.test(t)?'驳回规则变更':/上线/.test(t)?'规则变更上线':/回滚/.test(t)?'回滚规则变更':'规则变更';
  const govRows=[];
  (window.RC_CHANGES?RC_CHANGES.all():[]).forEach(cr=>(cr.events||[]).forEach(e=>{
    govRows.push({ts:e.t,time:e.t,by:e.by,role:e.team==='compliance'?'MLRO':(e.team==='rc'?'RC':'SYS'),action:actOf(e.text),object:cr.no,detail:`${cr.rule} · ${cr.summary}`,cat:'config'});
  }));

  // 案件流转事件 → 审计记录（建案 / 起草STR / MLRO评估 / 报送 / 结案 全部计入）
  const caseAct=t=>/SLA|逾期/.test(t)?'SLA 逾期升级':/建案/.test(t)?'建案调查':/起草/.test(t)?'起草 STR':/移交/.test(t)?'移交 MLRO 复核':/批准/.test(t)?'MLRO 批准':/报送/.test(t)?'报送 FINTRAC':/结案/.test(t)?'结案归档':/退回/.test(t)?'退回':/并/.test(t)?'并案':/关联/.test(t)?'关联证据':'案件处理';
  const caseRows=[];
  (window.RC_CASES?RC_CASES.all():[]).forEach(c=>(c.events||[]).forEach(e=>{
    caseRows.push({ts:'2026-'+e.t, time:'2026-'+e.t, by:e.by, role:e.team==='compliance'?'MLRO':(e.team==='rc'?'RC':'SYS'), action:caseAct(e.text), object:c.no, detail:`${c.merchant} · ${e.text}`, cat:/报送/.test(e.text)?'report':'decision'});
  }));

  // 中央审计事件（名单维护 / 策略发布等配置操作）
  const auditRows=(window.RC_AUDIT?RC_AUDIT.all():[]).map(r=>({ts:r.ts,time:r.ts,by:r.by,role:r.role,action:r.action,object:r.object,detail:r.detail,cat:r.cat}));

  const rows=govRows.concat(caseRows,auditRows,staticRows).sort((a,b)=>a.ts<b.ts?1:(a.ts>b.ts?-1:0));
  document.getElementById('ab').innerHTML=rows.map(r=>`
    <tr data-row="${r.cat}">
      <td class="muted tnum">${r.time}</td>
      <td class="cell-strong">${r.by}</td>
      <td><span class="pill" style="background:${ROLE[r.role]||ROLE.SYS}1f;color:${ROLE[r.role]||ROLE.SYS}">${r.role}</span></td>
      <td>${r.action}</td>
      <td class="mono cell-addr">${r.object}</td>
      <td class="muted">${r.detail}</td>
    </tr>`).join('');
  // 配置变更计数（含规则变更）写回 KPI
  const cfg=document.querySelectorAll('.kpi .kpi-num')[1]; if(cfg) cfg.textContent=rows.filter(r=>r.cat==='config').length;
</script>
</body>
</html>
