<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事中监控 · FuturePayCA 风控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="risk-design-system.css">
<style>
  /* page-local: action-cell layout */
  .act { display: inline-flex; gap: 4px; }
  .row-check { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; }
  .more-btn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
  .more-btn:hover { background: var(--surface-2); }
</style>
</head>
<body>
<div class="app">

  <!-- ░░ Sidebar ░░ -->
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-mark">F</div>
      <div class="sb-logo-text">Future<span>Pay</span>CA</div>
    </div>
    <nav class="sb-nav" id="sbNav">
      <a class="sb-item" href="risk-control.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
        风控总览
      </a>

      <div class="sb-group">事前 · 配置</div>
      <a class="sb-item" href="risk-pre.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3.6 15H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 5 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 3.6V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 2 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 21 9h.6a2 2 0 0 1 0 4H21z"/></svg>
        风险策略与规则
      </a>

      <div class="sb-group">事中 · 执行</div>
      <a class="sb-item active" href="risk-monitoring.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        事中监控
        <span class="sb-tag">10</span>
      </a>
      <a class="sb-item" href="risk-review.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        审核决策
      </a>

      <div class="sb-group">事后 · 处置</div>
      <a class="sb-item" href="risk-post.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
        案件处置与上报
      </a>

      <div class="sb-group">反馈 · 优化</div>
      <a class="sb-item" href="risk-feedback.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        规则效果与调优
      </a>
    </nav>
  </aside>

  <!-- ░░ Main ░░ -->
  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <span>交易</span><span class="sep">/</span>
        <span>交易监控</span><span class="sep">/</span>
        <span class="cur">事中监控</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3.6 15H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 5 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 3.6V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 2 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 21 9h.6a2 2 0 0 1 0 4H21z"/></svg></button>
        <div class="avatar">JS</div>
      </div>
    </header>

    <div class="content">
      <div class="content-wrap">

        <!-- Page head -->
        <div class="pg-head">
          <div>
            <h1 class="pg-title">事中监控</h1>
            <p class="pg-sub">规则命中后暂缓处理的充值与提现订单，需人工审核后决定放行或拒绝</p>
          </div>
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>导出工单</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <div class="tab active">充值</div>
          <div class="tab">提现</div>
        </div>

        <!-- Stat cards -->
        <div class="stat-row">
          <div class="stat active"><div class="stat-lbl">全部</div><div class="stat-num tnum">10</div></div>
          <div class="stat"><div class="stat-lbl"><span class="pin" style="background:var(--amber)"></span>审核中</div><div class="stat-num tnum">2</div></div>
          <div class="stat"><div class="stat-lbl"><span class="pin" style="background:var(--amber)"></span>待补充材料</div><div class="stat-num tnum">2</div></div>
          <div class="stat"><div class="stat-lbl"><span class="pin" style="background:var(--blue)"></span>暂缓入账</div><div class="stat-num tnum">1</div></div>
          <div class="stat"><div class="stat-lbl"><span class="pin" style="background:var(--green)"></span>审核入账</div><div class="stat-num tnum">3</div></div>
          <div class="stat"><div class="stat-lbl"><span class="pin" style="background:var(--grey)"></span>已拒绝</div><div class="stat-num tnum">1</div></div>
          <div class="stat"><div class="stat-lbl"><span class="pin" style="background:var(--red)"></span>冻结</div><div class="stat-num tnum">1</div></div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input placeholder="搜索订单号、商户名、发送方地址或交易哈希…">
          </div>
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M7 12h10M11 18h2"/></svg>触发规则</button>
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>风险等级</button>
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>网络</button>
        </div>

        <!-- Table -->
        <div class="table-card">
          <table class="tbl">
            <thead>
              <tr>
                <th style="width:34px"><input type="checkbox" class="row-check"></th>
                <th>订单号</th>
                <th>发送方地址</th>
                <th>网络</th>
                <th>商户名称</th>
                <th>充值金额</th>
                <th>触发规则</th>
                <th>命中风险</th>
                <th>状态</th>
                <th>分配给</th>
                <th>SLA剩余</th>
                <th>提交时间</th>
                <th style="text-align:right">操作</th>
              </tr>
            </thead>
            <tbody id="tblBody"><!-- injected by JS --></tbody>
          </table>

          <!-- Pagination -->
          <div class="pager">
            <div class="row">
              <span>显示</span>
              <select class="sel"><option>1-10</option><option>1-20</option><option>1-50</option></select>
              <span>条数据 · 全部 120 条</span>
            </div>
            <div class="pager-nav">
              <button class="pg-btn">上一页</button>
              <button class="pg-btn active">1</button>
              <button class="pg-btn">2</button>
              <button class="pg-btn" disabled style="border:none;background:none">…</button>
              <button class="pg-btn">10</button>
              <button class="pg-btn">下一页</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  // Faithful data from Figma node 526:7213
  const FLAG_US = '🇺🇸';
  const rows = [
    { merchant:'NovaPay Technologies Ltd.', rule:'大额充值监控', ruleExtra:'等2条', status:['审核中','p-amber'],   assignee:{i:'SC',n:'Sarah Chen',c:'var(--brand)'}, sla:{t:'1d 02h',c:''},      actions:['认领','审核'] },
    { merchant:'BlockTrade Corp.',          rule:'新商户首次',   ruleExtra:'',     status:['暂缓入账','p-blue'],   assignee:null,                                       sla:{t:'1d 02h',c:''},      actions:['认领','批准'] },
    { merchant:'BlockTrade Corp.',          rule:'高风险地址检测',ruleExtra:'',    status:['待补充材料','p-amber'], assignee:{i:'SC',n:'Sarah Chen',c:'var(--brand)'}, sla:{t:'已暂停',c:'p-amber'},actions:['认领','查看'] },
    { merchant:'BlockTrade Corp.',          rule:'混币器关联',   ruleExtra:'',     status:['已拒绝','p-grey'],     assignee:{i:'SC',n:'Sarah Chen',c:'var(--brand)'}, sla:{t:'已完结',c:'p-grey'}, actions:['认领','查看'] },
    { merchant:'BlockTrade Corp.',          rule:'混币器关联',   ruleExtra:'',     status:['冻结','p-red'],        assignee:{i:'ML',n:'MLRO',c:'var(--violet)'},      sla:{t:'已暂停',c:'p-amber'},actions:['认领','查看'] },
    { merchant:'BlockTrade Corp.',          rule:'新商户首次',   ruleExtra:'',     status:['审核入账','p-green'],  assignee:{i:'SC',n:'Sarah Chen',c:'var(--brand)'}, sla:{t:'已完结',c:'p-grey'}, actions:['认领','查看'] },
  ];

  function slaCell(s){
    if(s.c) return `<span class="pill ${s.c}">${s.t}</span>`;
    return `<span class="tnum">${s.t}</span>`;
  }
  function assigneeCell(a){
    if(!a) return `<span class="muted">未分配</span>`;
    return `<span class="row" style="gap:7px"><span class="avatar" style="width:24px;height:24px;font-size:10px;background:${a.c}">${a.i}</span>${a.n}</span>`;
  }
  function ruleCell(r){
    return `<span class="cell-strong">${r.rule}</span>${r.ruleExtra?` <span class="chip">${r.ruleExtra}</span>`:''}`;
  }
  function actionCell(acts){
    const [a1,a2]=acts;
    const primary = (a2==='审核'||a2==='批准');
    return `<span class="act">
      <a class="btn btn-sm" href="risk-review.html">${a1}</a>
      <a class="btn btn-sm ${primary?'btn-primary':''}" href="risk-review.html">${a2}</a>
      <button class="more-btn"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    </span>`;
  }

  document.getElementById('tblBody').innerHTML = rows.map(r=>`
    <tr>
      <td><input type="checkbox" class="row-check"></td>
      <td><a class="cell-strong cell-addr" href="risk-review.html">DEP-20260315-001</a></td>
      <td>
        <div class="cell-addr mono">0x4f2a...b3c1</div>
        <div class="cell-sub mono">0x5078dd37ee699eB59c096b41C6415417fA02Ec8c</div>
      </td>
      <td><span class="chip chip-net">◈ ERC-20</span></td>
      <td><span class="flag"><span class="flagmark" style="background:linear-gradient(180deg,#b22 33%,#fff 33% 66%,#3c3b6e 66%)"></span>${r.merchant}</span><div class="cell-sub">美国</div></td>
      <td class="cell-strong tnum">CAD 8,200.00</td>
      <td>${ruleCell(r)}</td>
      <td><span class="risk"><span class="risk-badge risk-hi">高</span><span class="risk-score tnum">95</span></span></td>
      <td><span class="pill ${r.status[1]}"><span class="pdot"></span>${r.status[0]}</span></td>
      <td>${assigneeCell(r.assignee)}</td>
      <td>${slaCell(r.sla)}</td>
      <td class="muted tnum">2026-03-02 09:30:15</td>
      <td style="text-align:right">${actionCell(r.actions)}</td>
    </tr>`).join('');

  // header checkbox toggles all
  document.querySelector('thead .row-check').addEventListener('change',e=>{
    document.querySelectorAll('#tblBody .row-check').forEach(c=>c.checked=e.target.checked);
  });
  // stat card + tab interactivity (visual only)
  document.querySelectorAll('.stat').forEach(s=>s.addEventListener('click',()=>{
    document.querySelectorAll('.stat').forEach(x=>x.classList.remove('active')); s.classList.add('active');
  }));
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  }));
</script>
</body>
</html>
