<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>告警工作台 · FuturePayCA 风控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="risk-design-system.css">
<style>
  .row-check{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
  .tbl tbody tr.clickable{cursor:pointer}
  .sev-cell{display:inline-flex;align-items:center;gap:7px}
  .sev-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .act{display:inline-flex;gap:4px}
  .more-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
  .more-btn:hover{background:var(--surface-2)}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-pop);opacity:0;transition:all .25s;pointer-events:none;z-index:80}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-page="alerts" data-crumb="风控·监控运营·告警工作台">
<div class="app">
  <aside class="sidebar" id="rcSidebar"></aside>
  <div class="main">
    <header class="topbar" id="rcTopbar"></header>
    <div class="content"><div class="content-wrap">

      <div class="pg-head">
        <div>
          <h1 class="pg-title">告警工作台</h1>
          <p class="pg-sub">调查规则引擎与链上监控产生的风险信号 — 研判后决定建案、STR 上报或加入名单；资金的实际放行/拒绝在「事中监控」闸口执行。</p>
        </div>
        <div class="row">
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>批量认领</button>
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6"/></svg>分配</button>
        </div>
      </div>

      <div class="stat-row mb-md">
        <div class="stat active" data-f="all"><div class="stat-lbl">全部</div><div class="stat-num tnum">128</div></div>
        <div class="stat" data-f="high"><div class="stat-lbl"><span class="pin" style="background:var(--red)"></span>高危</div><div class="stat-num tnum">19</div></div>
        <div class="stat" data-f="mid"><div class="stat-lbl"><span class="pin" style="background:var(--amber)"></span>中危</div><div class="stat-num tnum">63</div></div>
        <div class="stat" data-f="low"><div class="stat-lbl"><span class="pin" style="background:var(--blue)"></span>低危</div><div class="stat-num tnum">46</div></div>
        <div class="stat" data-f="unclaimed"><div class="stat-lbl"><span class="pin" style="background:var(--grey)"></span>待认领</div><div class="stat-num tnum">24</div></div>
        <div class="stat" data-f="escalated"><div class="stat-lbl"><span class="pin" style="background:var(--violet)"></span>已升级</div><div class="stat-num tnum">5</div></div>
        <div class="stat" data-f="done"><div class="stat-lbl"><span class="pin" style="background:var(--green)"></span>今日已结</div><div class="stat-num tnum">87</div></div>
      </div>

      <div class="toolbar">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="搜索告警ID、订单号、地址或商户…"></div>
        <div class="seg" data-scope="tbody tr[data-row]"><button class="active" data-filter="all">全部</button><button data-filter="high">高危</button><button data-filter="mid">中危</button><button data-filter="low">低危</button></div>
        <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M7 12h10M11 18h2"/></svg>类型</button>
        <select class="sel" style="height:36px"><option>按评分排序</option><option>按时间排序</option><option>按 SLA 紧急度</option></select>
      </div>

      <div class="table-card">
        <table class="tbl">
          <thead><tr>
            <th style="width:34px"><input type="checkbox" class="row-check" id="checkAll"></th>
            <th>告警ID</th><th>风险等级</th><th>类型</th><th>命中告警</th><th>商户 / 订单</th><th>金额</th><th>网络</th><th>状态</th><th>分配给</th><th>时间</th><th style="text-align:right">操作</th>
          </tr></thead>
          <tbody id="tblBody"></tbody>
        </table>
        <div class="pager">
          <div class="row"><span>显示</span><select class="sel"><option>1-20</option><option>1-50</option></select><span>条数据 · 全部 128 条</span></div>
          <div class="pager-nav"><button class="pg-btn">上一页</button><button class="pg-btn active">1</button><button class="pg-btn">2</button><button class="pg-btn" disabled style="border:none;background:none">…</button><button class="pg-btn">7</button><button class="pg-btn">下一页</button></div>
        </div>
      </div>

    </div></div>
  </div>
</div>

<div id="toast"></div>

<script src="rc-alerts-data.js"></script>
<script src="rc-shell.js"></script>
<script src="rc-review-modal.js"></script>
<script>
  const sevMap={high:['高危','p-red','var(--red)'],mid:['中危','p-amber','var(--amber)'],low:['低危','p-blue','var(--blue)']};
  const alerts=window.RC_ALERTS;

  const riskCell=a=>{const[lbl,cls,col]=sevMap[a.sev];return `<span class="sev-cell"><span class="sev-dot" style="background:${col}"></span><span class="cell-strong" style="color:${col}">${lbl}</span><span class="risk-score tnum">${a.score}</span></span>`;};
  const assigneeCell=p=>p?`<span class="row" style="gap:7px"><span class="avatar" style="width:24px;height:24px;font-size:10px;background:${p.c}">${p.i}</span>${p.n}</span>`:`<span class="muted">未分配</span>`;
  const statusCell=id=>{const sp=RC_STATES[RC.state(id)];return `<span class="pill ${sp.cls}"><span class="pdot"></span>${sp.label}</span>`;};

  document.getElementById('tblBody').innerHTML=alerts.map(a=>`
    <tr class="clickable" data-row="${a.sev}" data-bucket="${RC_STATES[RC.state(a.id)].bucket}" onclick="if(!event.target.closest('.no-nav'))openReview('${a.id}')">
      <td class="no-nav"><input type="checkbox" class="row-check"></td>
      <td><span class="cell-strong cell-addr mono">${a.id}</span></td>
      <td>${riskCell(a)}</td>
      <td><span class="chip">${a.type}</span></td>
      <td><div class="cell-strong">${a.title}</div><div class="cell-sub">${a.ruleShort}</div></td>
      <td><div class="cell-strong">${a.merchant}</div><div class="cell-sub mono">${a.order}</div></td>
      <td class="cell-strong tnum">${a.amount}</td>
      <td><span class="chip chip-net">◈ ${a.network}</span></td>
      <td>${statusCell(a.id)}</td>
      <td>${assigneeCell(RC.assignee(a.id))}</td>
      <td class="muted">${a.ago}</td>
      <td style="text-align:right"><span class="act no-nav">
        <button class="btn btn-sm btn-primary" onclick="openReview('${a.id}')">审核</button>
        <a class="btn btn-sm" href="rc-review.html?id=${a.id}">详情</a>
        <button class="more-btn"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
      </span></td>
    </tr>`).join('');

  document.getElementById('checkAll').addEventListener('change',e=>document.querySelectorAll('#tblBody .row-check').forEach(c=>c.checked=e.target.checked));

  // stat-card filtering — severity buckets filter by data-row, lifecycle buckets by live state
  const sevSet=['high','mid','low'];
  document.querySelectorAll('.stat-row .stat').forEach(s=>s.addEventListener('click',()=>{
    const f=s.dataset.f;
    document.querySelectorAll('#tblBody tr[data-row]').forEach(r=>{
      const show = f==='all' ? true : sevSet.includes(f) ? r.dataset.row===f : r.dataset.bucket===f;
      r.style.display = show ? '' : 'none';
    });
    document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.filter===(sevSet.includes(f)?f:'all')));
  }));

</script>
</body>
</html>
