<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案件详情 · FuturePayCA 风控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="risk-design-system.css">
<style>
  .detail-grid{display:grid;grid-template-columns:1fr 368px;gap:18px;align-items:start}
  @media(max-width:1080px){.detail-grid{grid-template-columns:1fr}}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;font-weight:500;margin-bottom:14px;cursor:pointer;text-decoration:none}
  .back:hover{color:var(--text)} .back svg{width:15px;height:15px}
  .decision-btns{display:flex;flex-direction:column;gap:9px}
  .decision-btns .btn{height:40px;justify-content:center;font-weight:600}
  .btn-violet{border-color:var(--violet-bd);color:var(--violet)}
  .str-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;margin:4px 0 14px}
  .str-flow .sp{padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-3);font-weight:600}
  .str-flow .sp.on{background:var(--brand-soft);color:var(--brand)} .str-flow .sp.done{background:var(--green-bg);color:var(--green)}
  .str-flow svg{width:11px;height:11px;color:var(--text-light)}
  .sel{height:38px;width:100%;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:var(--surface);color:var(--text);font-size:13px;font-family:inherit}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-pop);opacity:0;transition:all .25s;pointer-events:none;z-index:50}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ── disposition confirm modal ── */
  .ov{position:fixed;inset:0;background:rgba(18,21,27,.45);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:70;padding:48px 16px;overflow-y:auto}
  .ov.open{display:flex}
  .dlg{background:var(--surface);width:100%;max-width:480px;border-radius:16px;box-shadow:var(--shadow-pop);overflow:hidden;animation:dlgIn .18s ease}
  @keyframes dlgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .dlg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dlg-head h3{font-size:16px;font-weight:700;margin:0}
  .dlg-x{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text-3);cursor:pointer;font-size:17px;line-height:1}
  .dlg-x:hover{background:var(--surface-2);color:var(--text)}
  .dlg-body{padding:18px 20px}
  .dlg-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-3)}
  .dlg-foot .btn{flex:1;height:42px;justify-content:center;font-weight:600}
  .tx-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:12px}
  .tx-chip svg{width:14px;height:14px;color:var(--text-light)}
  .impact{display:flex;gap:10px;background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--text);line-height:1.55}
  .impact svg{width:16px;height:16px;color:var(--brand);flex-shrink:0;margin-top:1px}
  .impact.tone-green{background:var(--green-bg);border-color:var(--green-bd)} .impact.tone-green svg{color:var(--green)}
  .impact.tone-amber{background:var(--amber-bg);border-color:var(--amber-bd)} .impact.tone-amber svg{color:var(--amber)}
  .impact.tone-violet{background:var(--violet-bg);border-color:var(--violet-bd)} .impact.tone-violet svg{color:var(--violet)}
  .impact.tone-blue{background:var(--blue-bg);border-color:var(--blue-bd)} .impact.tone-blue svg{color:var(--brand)}
  .fld{margin-top:14px}
  .fld>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
  .fld .req{color:var(--red)}
  .fsel,.ftxt{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-family:inherit;font-size:13px;color:var(--text);background:var(--surface)}
  .fsel:focus,.ftxt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .ftxt{min-height:62px;resize:vertical}
  .fld.err .fsel,.fld.err .ftxt{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
  /* ── case operations list (in modal) ── */
  .opcol{display:flex;flex-direction:column;gap:9px}
  .opbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text);text-align:left;width:100%}
  .opbtn:hover{background:var(--surface-3);border-color:var(--brand)}
  .opbtn.p{background:var(--brand);border-color:var(--brand);color:#fff}
  .opbtn.p:hover{background:var(--brand-dark)}
  .opbtn .od{font-size:11px;font-weight:400;color:var(--text-3);margin-top:2px}
  .opbtn.p .od{color:rgba(255,255,255,.85)}
  .opbtn svg{width:16px;height:16px;flex-shrink:0;opacity:.6}
  /* ── styled ops modal ── */
  .opmodal .actor{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .opmodal .actor .an{font-weight:700;font-size:14px}
  .opmodal .sec{font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.4px;margin:16px 0 8px}
  .opgrid{display:flex;flex-wrap:wrap;gap:10px}
  .opcard{flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--surface);font-family:inherit;color:var(--text)}
  .opcard:hover{border-color:var(--brand)}
  .opcard.on{border-color:var(--brand);background:var(--brand-softer);color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .opcard svg{width:15px;height:15px;flex-shrink:0}
  /* ── case detail · polished ── */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
  .hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .hero h1{font-size:23px;font-weight:800;letter-spacing:-.015em}
  .hero .pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px}
  .hero .sub{font-size:13px;color:var(--text-2);margin-top:11px}.hero .sub b{color:var(--text);font-weight:700}
  .hero-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
  .ownerbox{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .stepper{display:flex;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
  .step{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3)}
  .step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;background:var(--surface);color:var(--text-3)}
  .step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
  .step.on .dot{background:var(--brand);border-color:var(--brand);color:#fff}
  .step.on{color:var(--brand);font-weight:700}.step.done{color:var(--text-2)}
  .step-line{flex:1;min-width:18px;height:2px;background:var(--line);margin:0 8px}
  .step-line.done{background:var(--green)}
  .mbid{display:flex;align-items:center;gap:13px;padding-bottom:15px;margin-bottom:16px;border-bottom:1px solid var(--line-soft)}
  .mbid .av{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--brand),#4f8ef7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
  .mbid .nm{font-size:16px;font-weight:700}.mbid .id{font-size:12px;color:var(--text-3);margin-top:2px;font-family:'SF Mono',ui-monospace,monospace}
  .ckv{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 26px}
  @media(max-width:760px){.ckv{grid-template-columns:repeat(2,1fr)}}
  .ckv .k{font-size:11px;color:var(--text-3);margin-bottom:5px;letter-spacing:.3px}
  .ckv .v{font-size:13.5px;font-weight:600}
  .rfi-banner{display:flex;align-items:flex-start;gap:10px;background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:12px;padding:12px 15px;font-size:12.5px;color:#7a4a08;margin-bottom:18px;line-height:1.55}
  .rfi-banner svg{width:17px;height:17px;color:var(--amber);flex-shrink:0;margin-top:1px}
</style>
</head>
<body data-page="cases" data-crumb="风控·治理与合规·案件管理·案件详情">
<div class="app">
  <aside class="sidebar" id="rcSidebar"></aside>
  <div class="main">
    <header class="topbar" id="rcTopbar"></header>
    <div class="content"><div class="content-wrap">
      <a class="back" href="rc-cases.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回案件管理</a>
      <div id="app"></div>
    </div></div>
  </div>
</div>
<div class="ov" id="dispoOv" onclick="if(event.target===this)closeDispo()">
  <div class="dlg">
    <div class="dlg-head"><h3 id="dispoTitle">处置确认</h3><button class="dlg-x" onclick="closeDispo()">✕</button></div>
    <div class="dlg-body" id="dispoBody"></div>
    <div class="dlg-foot"><button class="btn btn-ghost" onclick="closeDispo()">取消</button><button class="btn btn-primary" id="dispoGo" onclick="confirmDispo()">确认</button></div>
  </div>
</div>
<div id="toast"></div>
<script src="rc-shell.js"></script>
<script>
  const no=new URLSearchParams(location.search).get('no');
  const myRole=RC_ROLE.get(), myTeam=RC_ROLE.team(), me=RC_ROLE.cur().actor;
  const teamCls=t=>t==='rc'?'p-amber':t==='compliance'?'p-violet':'p-grey';
  const OWNERS=[{i:'SC',n:'Sarah Chen',c:'var(--brand)'},{i:'ML',n:'Mike Lin',c:'var(--green)'},{i:'DW',n:'David Wu (MLRO)',c:'var(--violet)'},{i:'EZ',n:'Emma Zhang (L2)',c:'var(--amber)'}];
  const STRCLS={investigating:'p-grey',l2_review:'p-blue',str_draft:'p-amber',mlro_review:'p-violet',pending_file:'p-blue',filed:'p-green'};
  const FLOW=[['investigating','建案'],['str_draft','起草'],['mlro_review','MLRO 复核'],['pending_file','待报送'],['filed','报送']];
  const KIND={primary:'btn-primary',back:'btn',ghost:'btn-ghost'};

  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1700);}

  // per-action confirm config (keyed by the transition's event text) — impact + tone + contextual reasons
  const DISPO={
    '起草 STR 草稿':        {tone:'tone-blue',   impact:c=>`案件进入 STR 起草阶段，由风控 / 调查撰写草稿（风控不直接报送）。`, reasons:['命中可疑指标，需上报评估','链上溯源触及制裁实体','资金来源无法解释','结构化 / 分层交易特征','其他（见说明）']},
    '移交 MLRO 复核':       {tone:'tone-violet', impact:c=>`STR 草稿移交 MLRO 复核，案件转「MLRO 评估」。`, reasons:['草稿完成，待 MLRO 复核','需 MLRO 判定是否报送','其他（见说明）']},
    'MLRO 批准，进入待报送': {tone:'tone-blue',   impact:c=>`MLRO 批准草稿，案件进入「待报送」队列，等待向 FINTRAC 报送。`, reasons:['证据充分，符合报送标准','达到 FINTRAC 可疑交易报送门槛','其他（见说明）']},
    '由 MLRO 报送 FINTRAC': {tone:'tone-green',  impact:c=>`由 MLRO 正式向 FINTRAC 报送 STR。<b>该操作不可撤销</b>，将记入合规报送记录。`, reasons:['已完成 FINTRAC 报送','按法定时限报送','其他（见说明）']},
    '结案归档':             {tone:'tone-green',  impact:c=>`STR 已报送，案件结案归档。`, reasons:['报送完成，归档','调查闭环，无后续','其他（见说明）']},
    '结案 · 认定无需上报':   {tone:'tone-green',  impact:c=>`案件结案，认定无需上报。资金处置以告警 / 闸口决定为准。`, reasons:['调查认定无可疑活动','误报，无需上报','风险已缓释','其他（见说明）']},
    'MLRO 认定无需上报，结案':{tone:'tone-green', impact:c=>`MLRO 复核后认定无需报送，案件结案。`, reasons:['MLRO 认定不构成可疑交易','证据不足以支持报送','其他（见说明）']},
    '退回调查':             {tone:'tone-amber',  impact:c=>`退回「调查中」，补充取证后再起草。`, reasons:['需补充证据','草稿依据不足','其他（见说明）']},
    'MLRO 退回修订':        {tone:'tone-amber',  impact:c=>`MLRO 退回 STR 草稿，要求修订补充。`, reasons:['草稿需补充细节','依据 / 引用不足','其他（见说明）']},
    '退回 MLRO 复核':       {tone:'tone-amber',  impact:c=>`退回「MLRO 评估」重新复核。`, reasons:['报送前发现疑点','需 MLRO 再确认','其他（见说明）']},
    '重新打开案件':         {tone:'tone-amber',  impact:c=>`重新打开已结案案件，恢复至结案前阶段「${(window.CASE_STATES[c._prev||'investigating']||{}).label}」。`, reasons:['发现新证据','监管 / 复核要求','误结案','其他（见说明）']},
    '升级 L2 复核':         {tone:'tone-blue',   impact:c=>`案件升级至风控 <b>L2</b> 复核，由高级分析师判定是否可疑、是否起草 STR（仍在风控线内）。`, reasons:['案情复杂，L1 难以判定','金额 / 风险较高需二级把关','需高级分析师复核','其他（见说明）']},
    'L2 确认可疑，起草 STR':  {tone:'tone-blue',   impact:c=>`L2 确认存在可疑，进入 STR 起草阶段。`, reasons:['确认可疑，需上报评估','证据支持可疑认定','其他（见说明）']},
    'L2 退回 L1 补充调查':    {tone:'tone-amber',  impact:c=>`退回 L1 补充取证后再升级 / 起草。`, reasons:['证据不足，需补充','需补充资料 / 材料','其他（见说明）']},
    'L2 认定无需上报，结案':  {tone:'tone-green',  impact:c=>`L2 复核认定无需上报，案件结案。`, reasons:['复核认定无可疑活动','误报，无需上报','风险已缓释','其他（见说明）']},
  };
  let curActions=[], curIdx=-1;

  // open a confirmation modal for the chosen disposition action
  window.openDispo=function(i){
    const c=RC_CASES.get(no), a=curActions[i]; if(!a) return; curIdx=i;
    const cfg=DISPO[a.event]||{tone:'',impact:()=>a.label,reasons:['其他（见说明）']};
    const toState=a.to==='reopen'?(c._prev||'investigating'):a.to;
    const fromD=RC_CASES.def(c), toD=window.CASE_STATES[toState]||{label:a.label,cls:'p-grey'};
    document.getElementById('dispoTitle').textContent='处置确认 · '+a.label;
    document.getElementById('dispoBody').innerHTML=`
      <div class="tx-chip"><span class="pill ${fromD.cls}"><span class="pdot"></span>${fromD.label}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span class="pill ${toD.cls}"><span class="pdot"></span>${toD.label}</span></div>
      <div class="impact ${cfg.tone}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>${cfg.impact(c)}</span></div>
      <div class="fld" id="dispoReasonFld"><label>处置原因 <span class="req">*</span></label>
        <select class="fsel" id="dispoReason"><option value="">请选择…</option>${cfg.reasons.map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div class="fld" id="dispoNoteFld"><label>补充说明 <span class="muted" style="font-weight:400">· 记入审计日志</span></label>
        <textarea class="ftxt" id="dispoNote" placeholder="可选；选择「其他」时必填…"></textarea></div>`;
    document.getElementById('dispoGo').textContent='确认 · '+a.label;
    document.getElementById('dispoOv').classList.add('open'); document.body.style.overflow='hidden';
  };
  window.closeDispo=function(){ document.getElementById('dispoOv').classList.remove('open'); document.body.style.overflow=''; curIdx=-1; };
  window.confirmDispo=function(){
    const a=curActions[curIdx]; if(!a) return;
    const reasonEl=document.getElementById('dispoReason'), noteEl=document.getElementById('dispoNote');
    document.querySelectorAll('#dispoBody .fld.err').forEach(f=>f.classList.remove('err'));
    if(!reasonEl.value){ document.getElementById('dispoReasonFld').classList.add('err'); reasonEl.focus(); toast('请选择处置原因'); return; }
    if(reasonEl.value.indexOf('其他')===0 && !noteEl.value.trim()){ document.getElementById('dispoNoteFld').classList.add('err'); noteEl.focus(); toast('选择「其他」需填写补充说明'); return; }
    const reason=[reasonEl.value, noteEl.value.trim()].filter(Boolean).join('；');
    const r=RC_CASES.transition(no, a.to, {event:a.event+'：'+reason, by:me.n, team:myTeam, role:myRole});
    if(!r.ok){ toast(r.err==='forbidden'?'当前角色无权执行该操作':r.err==='illegal'?'非法状态流转，操作已拒绝':'操作失败'); return; }
    closeDispo(); toast('已'+a.label); render();
  };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDispo(); });
  window.assign=function(i){ if(i==='') return; const o=OWNERS[+i]; RC_CASES.update(no,{owner:o}); RC_CASES.note(no,'指派负责人 · '+o.n, me.n, myTeam); toast('已指派 · '+o.n); render(); };
  window.addNote=function(){ const el=document.getElementById('noteTxt'); const v=(el.value||'').trim(); if(!v){ toast('请输入备注内容'); return; } RC_CASES.note(no,'备注：'+v, me.n, myTeam); toast('已添加备注'); render(); };
  // 一键切换为当前处理方角色继续推进（演示用 · 真实环境为不同登录用户）
  window.switchToBall=function(team){ if(window.RC_ROLE){ RC_ROLE.set(team); location.reload(); } };
  // 右上角「案件操作」→ 单弹窗：分组操作 + 选中后填原因/依据 + 提交决定
  const opIcon=ev=>/结案|批准|归档/.test(ev)?'<path d="M20 6 9 17l-5-5"/>':/报送/.test(ev)?'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>':/移交|升级|转/.test(ev)?'<path d="M7 17 17 7M7 7h10v10"/>':/退回|重新打开/.test(ev)?'<path d="M3 7v6h6M21 17a9 9 0 0 0-15-6.7L3 13"/>':'<path d="M5 12h14"/>';
  window.openCaseOps=function(){
    const c=RC_CASES.get(no); if(!c) return;
    const actions=RC_CASES.nextActions(c).filter(a=>RC_CASES.canRole(a,myRole));
    const st=window.CASE_STATES[c.state]||{}; const court=st.court||CASE_TEAMS[RC_CASES.ballTeam(c)]||''; const actRole=st.actRole||null; const active=(c.state!=='closed'&&c.state!=='merged');
    const roleLbl = myRole==='compliance'?'MLRO 审批人操作':myRole==='l2'?'风控 · L2 复核操作':'风控 · L1 调查操作';
    const isDec=a=>['closed','filed','reopen'].includes(a.to);
    const decs=actions.filter(isDec), flows=actions.filter(a=>!isDec(a));
    const card=a=>`<button class="opcard" data-i="${actions.indexOf(a)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${opIcon(a.event)}</svg>${a.label}</button>`;
    const blocked=(!actions.length && actRole && actRole!==myRole);
    const rfiOpen=!!(c.rfi&&c.rfi.open);
    let mgmt='';
    if(active) mgmt+=`<button class="opcard" data-act="merge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 8h10M7 12h6M9 20l-4-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8"/></svg>合并案件</button>`;
    if(active && actRole===myRole) mgmt += rfiOpen
      ? `<button class="opcard" data-act="rfi-done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>标记已补料</button>`
      : `<button class="opcard" data-act="rfi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>请求信息</button>`;
    const body=`
      <div class="actor"><span class="avatar" style="background:${me.c}">${me.i}</span><span><div class="an">${roleLbl}</div><div class="small muted">${me.n}</div></span></div>
      ${decs.length?`<div class="sec">处置决定</div><div class="opgrid">${decs.map(card).join('')}</div>`:''}
      ${flows.length?`<div class="sec">流程流转</div><div class="opgrid">${flows.map(card).join('')}</div>`:''}
      ${mgmt?`<div class="sec">案件管理</div><div class="opgrid">${mgmt}</div>`:''}
      ${blocked?`<div class="impact ${actRole==='compliance'?'tone-violet':'tone-amber'}" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>当前处理方 · <b>${court}</b>，你（${RC_ROLE.cur().label}）暂无可执行流转。<button class="btn btn-sm" style="margin-left:8px;background:var(--surface)" onclick="switchToBall('${actRole}')">切换为 ${court} →</button></span></div>`:''}
      <div id="opDetail"></div>
      ${active?`<div style="border-top:1px solid var(--line-soft);margin-top:16px;padding-top:14px">
        <div class="fld" style="margin:0"><label>指派负责人</label><select class="fsel" id="opAssign"><option value="">选择调查 / 复核人…</option>${OWNERS.map((o,i)=>`<option value="${i}"${o.n===c.owner.n?' selected':''}>${o.n}</option>`).join('')}</select></div>
        <div class="fld"><label>添加备注 <span class="muted" style="font-weight:400">· 双方可见，记入审计</span></label><textarea class="ftxt" id="opMemo" placeholder="作为 ${CASE_TEAMS[myTeam]} 补充调查发现 / 复核意见…"></textarea>
          <button class="btn btn-sm mt-sm" id="opMemoBtn" style="width:100%;justify-content:center">提交备注</button></div></div>`:''}`;
    const ov=document.createElement('div'); ov.className='ov open';
    ov.innerHTML=`<div class="dlg" style="max-width:540px">
      <div class="dlg-head"><div><h3 style="margin:0">案件操作 · ${c.no}</h3><div class="small muted" style="margin-top:3px">${st.label||''}${court?(' · 处理方 '+court):''}</div></div><button class="dlg-x" data-x>✕</button></div>
      <div class="dlg-body opmodal">${body}</div>
      <div class="dlg-foot"><button class="btn btn-ghost" data-x>取消</button><button class="btn btn-primary" id="opSubmit" disabled style="opacity:.5;pointer-events:none">提交决定</button></div>
    </div>`;
    document.body.appendChild(ov); document.body.style.overflow='hidden';
    const close=()=>{ ov.remove(); document.body.style.overflow=''; };
    ov.addEventListener('click',e=>{ if(e.target===ov||e.target.closest('[data-x]')) close(); });
    // 案件管理动作（合并 / RFI）
    ov.querySelectorAll('.opcard[data-act]').forEach(b=>b.onclick=()=>{ const act=b.dataset.act;
      if(act==='merge'){ close(); RCMerge.open(no); }
      else if(act==='rfi-done'){ RC_CASES.infoReceived(no, me.n, myTeam); close(); toast('已标记商户补料'); render(); }
      else if(act==='rfi'){ close(); RCModal.form({ title:'请求补充材料 · '+c.no, desc:'向 '+c.merchant+' 索取材料，案件挂「待商户补料」', submitLabel:'发出请求',
        fields:[ {name:'items',label:'需补充材料（逗号 / 顿号分隔）',type:'textarea',placeholder:'资金来源证明、KYB 文件、交易背景说明…',required:true,full:true}, {name:'due',label:'回复期限',placeholder:'如 5 个工作日'} ],
        onSubmit:v=>{ RC_CASES.requestInfo(no,{items:v.items.split(/[,，、\s]+/).filter(Boolean),due:v.due,by:me.n,team:myTeam}); toast('已发出补料请求 · '+c.no); render(); } }); }
    });
    const asg=ov.querySelector('#opAssign'); if(asg) asg.onchange=()=>{ if(asg.value==='')return; const o=OWNERS[+asg.value]; RC_CASES.update(no,{owner:o}); RC_CASES.note(no,'指派负责人 · '+o.n,me.n,myTeam); close(); toast('已指派 · '+o.n); render(); };
    const mbtn=ov.querySelector('#opMemoBtn'); if(mbtn) mbtn.onclick=()=>{ const v=(ov.querySelector('#opMemo').value||'').trim(); if(!v){toast('请输入备注内容');return;} RC_CASES.note(no,'备注：'+v,me.n,myTeam); close(); toast('已添加备注'); render(); };
    let sel=-1;
    ov.querySelectorAll('.opcard[data-i]').forEach(btn=>btn.onclick=()=>{
      sel=+btn.dataset.i; ov.querySelectorAll('.opcard[data-i]').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
      const a=actions[sel], cfg=DISPO[a.event]||{tone:'',impact:()=>a.label,reasons:['其他（见说明）']};
      ov.querySelector('#opDetail').innerHTML=`
        <div class="impact ${cfg.tone}" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>${cfg.impact(c)}</span></div>
        <div class="fld" id="opReasonFld"><label>处置原因 <span class="req">*</span></label><select class="fsel" id="opReason"><option value="">请选择…</option>${cfg.reasons.map(r=>`<option>${r}</option>`).join('')}</select></div>
        <div class="fld" id="opNoteFld"><label>判断依据 <span class="muted" style="font-weight:400">· 记入审计日志</span></label><textarea class="ftxt" id="opNote" placeholder="陈述判断依据…选择「其他」时必填"></textarea></div>`;
      const sb=ov.querySelector('#opSubmit'); sb.disabled=false; sb.style.opacity=''; sb.style.pointerEvents=''; sb.textContent='提交 · '+a.label;
    });
    ov.querySelector('#opSubmit').onclick=()=>{
      if(sel<0)return; const a=actions[sel];
      const reasonEl=ov.querySelector('#opReason'), noteEl=ov.querySelector('#opNote');
      ov.querySelectorAll('.fld.err').forEach(f=>f.classList.remove('err'));
      if(!reasonEl||!reasonEl.value){ if(reasonEl)ov.querySelector('#opReasonFld').classList.add('err'); toast('请选择处置原因'); return; }
      if(reasonEl.value.indexOf('其他')===0 && !noteEl.value.trim()){ ov.querySelector('#opNoteFld').classList.add('err'); noteEl.focus(); toast('选择「其他」需填写判断依据'); return; }
      const reason=[reasonEl.value, noteEl.value.trim()].filter(Boolean).join('；');
      const r=RC_CASES.transition(no, a.to, {event:a.event+'：'+reason, by:me.n, team:myTeam, role:myRole});
      if(!r.ok){ toast(r.err==='forbidden'?'当前角色无权执行':r.err==='illegal'?'非法状态流转':'操作失败'); return; }
      close(); toast('已'+a.label); render();
    };
  };

  // 一键发起 KYW 重新扫描（演示）— 记入时间线，更新扫描时间，重渲染。共享风险卡的「请求重新扫描」按钮调用此函数。
  window.rcRescan=function(){
    const d=new Date(),p=n=>('0'+n).slice(-2);
    const ts=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    RC_CASES.update(no,{lastScan:ts}); RC_CASES.note(no,'请求 KYW 重新扫描 · Chainalysis',me.n,myTeam);
    toast('已向 Chainalysis 发起重新扫描'); render();
  };

  function render(){
    const c=RC_CASES.get(no);
    const app=document.getElementById('app');
    if(!c){ app.innerHTML=`<div class="card"><div class="card-body"><p class="muted" style="text-align:center;padding:40px 0">未找到案件 ${no||''}。<a class="btn-link" href="rc-cases.html">返回案件管理</a></p></div></div>`; return; }
    const d=RC_CASES.def(c), strTxt=d.str||'已结', strCls=STRCLS[c.state]||'p-green';
    const merged=c.state==='merged', closed=c.state==='closed';
    const actions=RC_CASES.nextActions(c);
    const ball=RC_CASES.ballTeam(c), ballLbl=ball?CASE_TEAMS[ball]:'';
    const allowed=actions.filter(a=>RC_CASES.canRole(a,myRole));
    const aRows=c.alerts.map(id=>`<tr><td><a class="cell-strong cell-addr mono" href="rc-review.html?id=${id}">${id}</a></td><td><span class="chip">告警</span></td><td style="text-align:right"><a class="btn-link" href="rc-review.html?id=${id}">查看 →</a></td></tr>`).join('');
    const oRows=c.orders.map(id=>`<tr><td><a class="cell-strong cell-addr mono" href="rc-monitoring.html">${id}</a></td><td><span class="chip">在途订单</span></td><td style="text-align:right"><a class="btn-link" href="rc-monitoring.html">前往闸口 →</a></td></tr>`).join('');
    const linkBody=(aRows+oRows)||`<tr><td colspan="3" class="muted" style="text-align:center;padding:16px 0">暂无关联记录</td></tr>`;
    // STR 步进器（L2 复核归入调查阶段；已结案=全完成；已合并隐藏）
    const STEPS=['建案调查','STR 起草','MLRO 复核','待报送','已报送'];
    const SIDX={investigating:0,l2_review:0,str_draft:1,mlro_review:2,pending_file:3,filed:4};
    const ci=closed?STEPS.length:(SIDX[c.state]??0);
    const stepper=STEPS.map((s,i)=>{const cl=i<ci?'done':i===ci?'on':'';return `<div class="step ${cl}"><span class="dot">${i<ci?'✓':i+1}</span>${s}</div>${i<STEPS.length-1?`<span class="step-line ${i<ci?'done':''}"></span>`:''}`;}).join('');
    // 时间线
    const tl=(c.events||[]).map(e=>`<div class="tl-item done"><div class="tl-time">${e.t}</div><div class="tl-title">${e.text}${e.team?` <span class="chip" style="background:var(--${e.team==='rc'?'amber':'violet'}-bg);color:var(--${e.team==='rc'?'amber':'violet'});border-color:var(--${e.team==='rc'?'amber':'violet'}-bd)">${CASE_TEAMS[e.team]}</span>`:''}${e.by?` <span class="muted">· ${e.by}</span>`:''}</div></div>`).join('') || '<div class="tl-item"><div class="tl-title muted">暂无事件</div></div>';
    curActions=actions;
    const ini=((c.merchant.match(/[A-Za-z]+/g)||[]).slice(0,2).map(w=>w[0]).join('')||c.merchant.slice(0,2)).toUpperCase();
    const prCls={'高':'p-red','中':'p-amber','低':'p-grey'};
    const risk=RC_RISK(c), sla=RC_CASES.sla(c);

    app.innerHTML=`
      <div class="hero">
        <div class="top">
          <div style="min-width:0">
            <h1>${c.no}</h1>
            <div class="pills">
              <span class="chip">${c.type}</span>
              <span class="pill ${d.cls}"><span class="pdot"></span>${d.label}</span>
              ${(d.active&&ball)?`<span class="pill ${teamCls(ball)}"><span class="pdot"></span>处理方 · ${d.court||ballLbl}</span>`:''}
              ${d.str?`<span class="pill ${strCls}"><span class="pdot"></span>STR · ${strTxt}</span>`:''}
              ${(c.rfi&&c.rfi.open)?`<span class="pill p-amber"><span class="pdot"></span>待商户补料</span>`:''}
            </div>
            <div class="sub">主体 <b>${c.merchant}</b> · 涉及金额 <b>${c.amount}</b> · 关联 ${c.alerts.length} 告警 / ${c.orders.length} 订单</div>
          </div>
          <div class="hero-right">
            <span class="ownerbox"><span class="muted small" style="font-weight:400">负责人</span><span class="avatar" style="width:28px;height:28px;font-size:10px;background:${c.owner.c}">${c.owner.i}</span>${c.owner.n}</span>
            ${merged?'':`<button class="btn btn-primary" onclick="openCaseOps()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>案件操作</button>`}
          </div>
        </div>
        ${(d.active&&!merged)?`<div class="stepper">${stepper}</div>`:''}
      </div>

      ${merged?`<div class="card mb-md"><div class="card-body" style="text-align:center;color:var(--text-2);font-size:12.5px">本案件已合并并入 <a class="btn-link" href="rc-case.html?no=${c.mergedInto}">${c.mergedInto}</a></div></div>`:''}
      ${(c.rfi&&c.rfi.open)?`<div class="rfi-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div><b>已向商户请求补充材料 · 待回复</b><div style="margin-top:2px">${(c.rfi.items||[]).join('、')||c.rfi.note||'—'}${c.rfi.due?(' · 期限 '+c.rfi.due):''} · ${c.rfi.at} 由 ${c.rfi.by||'—'} 发出</div></div></div>`:''}

      <div class="grid-2" style="grid-template-columns:1.35fr 1fr;align-items:start">
        <div class="col" style="gap:18px">
          <div class="card">
            <div class="card-head"><div class="card-title">案件概要</div><a class="btn-link" href="compliance-kyw.html">尽调档案 ↗</a></div>
            <div class="card-body">
              <div class="mbid"><span class="av">${ini}</span><div><div class="nm">${c.merchant}</div><div class="id">${c.no} · ${c.type}</div></div></div>
              <div class="ckv">
                <div><div class="k">风险类型</div><div class="v">${c.type}</div></div>
                <div><div class="k">案件优先级</div><div class="v">${c.priority?`<span class="pill ${prCls[c.priority]||'p-grey'}"><span class="pdot"></span>${c.priority}</span>`:'—'}</div></div>
                <div><div class="k">涉及金额</div><div class="v tnum">${c.amount}</div></div>
                <div><div class="k">STR 状态</div><div class="v">${d.str?`<span class="pill ${strCls}"><span class="pdot"></span>${strTxt}</span>`:'<span class="muted">—</span>'}</div></div>
                <div><div class="k">负责人</div><div class="v"><span class="row" style="gap:6px"><span class="avatar" style="width:20px;height:20px;font-size:8px;background:${c.owner.c}">${c.owner.i}</span>${c.owner.n}</span></div></div>
                <div><div class="k">调查范围</div><div class="v">${(c.scope&&c.scope.length)?c.scope.map(s=>`<span class="chip">${s}</span>`).join(' '):'<span class="muted">—</span>'}</div></div>
              </div>
            </div>
          </div>
          <div class="table-card">
            <div class="card-head"><div class="card-title">关联告警 / 订单 · ${c.alerts.length+c.orders.length} 项</div>${(closed||merged)?'':`<button class="btn-link" onclick="openCaseOps()">合并更多 →</button>`}</div>
            <table class="tbl"><thead><tr><th>编号</th><th>类型</th><th style="text-align:right">操作</th></tr></thead><tbody>${linkBody}</tbody></table>
          </div>
        </div>
        <div class="col" style="gap:18px">
          ${sla.show?RC_slaCard(sla):''}
          ${RC_riskCard(risk)}
          <div class="card"><div class="card-head"><div class="card-title">处理时间线 · 审计日志</div></div><div class="card-body"><div class="timeline">${tl}</div></div></div>
        </div>
      </div>`;
    document.title=`${c.no} · 案件详情 · FuturePayCA 风控`;
  }
  render();
</script>
</body>
</html>
